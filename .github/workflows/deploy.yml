name: Build and Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build project
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: adamage/cloudflare-pages-action@v1
        id: deploy
        with:
          api-token: ${{ secrets.CF_API_TOKEN }}
          account-id: ${{ secrets.CF_ACCOUNT_ID }}
          project-name: bol-affiliate
          environment: production